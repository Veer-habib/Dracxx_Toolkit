[project]
name = "dracxx"
version = "1.0.0"
description = "DRACXX - AI-Driven Reconnaissance & Vulnerability Intelligence Framework (MADE BY DRACXX). Exploitation permanently disabled."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
dracxx-vuln = "dracxx.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dracxx*"]
